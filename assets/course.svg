<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" role="img" aria-labelledby="title desc">
<title id="title">데이터로 미래 값을 예상하는 과정</title>
<desc id="desc">과거 데이터를 넣어요. 예측하는 프로그램을 만들어요. 미래 값을 예상해요. 예상한 값이 실제 값과 얼마나 맞는지 확인해요.</desc>
<rect width="580" height="420" rx="28" fill="#e7efeb"/>
<g fill="#fff" stroke="#ccd8d1" stroke-width="2"><rect x="24" y="24" width="532" height="72" rx="14"/><rect x="24" y="124" width="532" height="72" rx="14"/><rect x="24" y="224" width="532" height="72" rx="14"/></g>
<g fill="#245a4a"><circle cx="62" cy="60" r="22"/><circle cx="62" cy="160" r="22"/><circle cx="62" cy="260" r="22"/></g>
<g font-family="system-ui,Malgun Gothic,sans-serif" text-anchor="middle" fill="white" font-size="21" font-weight="700"><text x="62" y="68">1</text><text x="62" y="168">2</text><text x="62" y="268">3</text></g>
<g fill="none" stroke="#315e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M290 104v12m-6-6 6 6 6-6"/><path d="M290 204v12m-6-6 6 6 6-6"/></g>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#244d42" font-size="22" font-weight="600"><text x="104" y="68">과거 데이터를 넣어요</text><text x="104" y="168">예측하는 프로그램을 만들어요</text><text x="104" y="268">미래 값을 예상해요</text></g>
<g font-family="system-ui,Malgun Gothic,sans-serif" fill="#244d42" font-size="19" text-anchor="middle"><text x="290" y="346">예상한 값이 실제 값과</text><text x="290" y="375">얼마나 맞는지 확인해요</text></g>
</svg>